<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoGuessr VS - Multiplayer Avançado</title>

  <!-- CSS do Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: Arial, sans-serif; background: #121212; color: #fff; }

    #street-view-container { width: 100%; height: 100%; border: none; }

    /* Máscara superior para cobrir endereço */
    #hide-location-overlay {
      position: absolute; top: 0; left: 0; width: 380px; height: 80px;
      background-color: #121212; z-index: 500; pointer-events: none;
      display: flex; align-items: center; padding-left: 20px;
      font-size: 0.95rem; font-weight: bold; border-bottom-right-radius: 12px;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
    }

    /* HUD do Cronômetro, Rodada e Barra de Animação */
    #hud-info {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
      background: rgba(18, 18, 18, 0.95); padding: 12px 25px; border-radius: 20px;
      border: 2px solid #3498db; font-size: 1.1rem; font-weight: bold; z-index: 500;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: none; text-align: center; width: 280px;
    }

    #timer-bar-container {
      width: 100%; height: 8px; background: #333; border-radius: 4px;
      margin-top: 8px; overflow: hidden;
    }

    #timer-bar {
      height: 100%; width: 100%; background: #2ecc71;
      transition: width 1s linear, background-color 0.5s ease;
    }

    /* Lobby e Sala de Espera */
    #lobby-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #121212; z-index: 9999; display: flex; flex-direction: column;
      justify-content: center; align-items: center; gap: 15px;
    }

    .card {
      background: #1e1e1e; padding: 30px; border-radius: 12px; width: 400px;
      text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,0.7);
    }

    input, select, button {
      width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: none;
      font-size: 1rem; outline: none;
    }

    input, select { background: #2a2a2a; color: #fff; text-align: center; }

    button { background: #3498db; color: #fff; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #2980b9; }
    button:disabled { background: #555 !important; cursor: not-allowed; }
    .btn-green { background: #27ae60; }
    .btn-green:hover { background: #219150; }
    .btn-orange { background: #e67e22; }
    .btn-orange:hover { background: #d35400; }
    .btn-gray { background: #7f8c8d; }
    .btn-gray:hover { background: #95a5a6; }

    #player-list {
      margin: 15px 0; text-align: left; background: #2a2a2a; padding: 12px; border-radius: 8px; max-height: 140px; overflow-y: auto; font-size: 0.95rem;
    }

    /* Minimapa */
    #guess-container {
      position: absolute; bottom: 20px; right: 20px; width: 420px; height: 340px;
      background: rgba(18, 18, 18, 0.95); border: 2px solid #333; border-radius: 14px;
      padding: 10px; z-index: 1000; box-shadow: 0 6px 20px rgba(0,0,0,0.7);
      display: flex; flex-direction: column; gap: 8px; transition: all 0.3s ease;
    }
    #guess-container:hover { width: 620px; height: 480px; border-color: #3498db; }
    #guess-map { width: 100%; flex: 1; border-radius: 8px; }

    /* Modal do Resultado / Tabelas */
    #result-modal {
      display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background-color: #1e1e1e; color: #fff; padding: 25px; border-radius: 12px;
      z-index: 10000; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); width: 450px;
      max-height: 90vh; overflow-y: auto;
    }

    #result-modal h2 { margin-bottom: 12px; color: #3498db; }

    .result-table {
      width: 100%; border-collapse: collapse; margin: 15px 0; font-size: 0.9rem;
    }
    .result-table th, .result-table td {
      padding: 10px; border: 1px solid #333; text-align: center;
    }
    .result-table th { background: #2a2a2a; color: #3498db; }
    .result-table tr:nth-child(even) { background: #181818; }
  </style>
</head>
<body>

  <!-- Lobby Multiplayer -->
  <div id="lobby-overlay">
    <div class="card" id="login-card">
      <h1 style="margin-bottom:15px; color:#3498db;">GeoGuessr VS</h1>
      <input type="text" id="player-name" placeholder="Seu Nome">
      <input type="text" id="room-code" placeholder="Código da Sala (ex: 1234)">
      
      <label style="display:block; text-align:left; margin-top:12px; font-size:0.85rem; color:#aaa;">Tempo por Rodada:</label>
      <select id="time-select">
        <option value="30">30 Segundos</option>
        <option value="60">60 Segundos (1 min)</option>
        <option value="90">90 Segundos</option>
        <option value="120" selected>120 Segundos (2 min)</option>
        <option value="180">180 Segundos (3 min)</option>
      </select>

      <button class="btn-green" onclick="handleJoin(true)">Criar Nova Sala</button>
      <button class="btn-orange" onclick="handleJoin(false)">Entrar em Sala Existente</button>
    </div>

    <!-- Sala de Espera -->
    <div class="card" id="waiting-card" style="display:none;">
      <h2 style="color:#3498db;">Sala: <span id="display-room-code"></span></h2>
      <p style="margin-top:5px; color:#aaa;" id="waiting-status">Carregando sala...</p>
      <div id="player-list"></div>
      <button id="btn-start-game" class="btn-green" style="display:none;" onclick="startGameHost()">🚀 Iniciar Jogo</button>
      <p id="host-msg" style="font-size:0.85rem; color:#888; margin-top:5px; display:none;">Aguardando o criador iniciar a partida...</p>
    </div>
  </div>

  <!-- HUD da Partida -->
  <div id="hud-info">
    <div>Rodada <span id="current-round">1</span>/8 | ⏱️ <span id="timer-count">120</span>s</div>
    <div id="timer-bar-container">
      <div id="timer-bar"></div>
    </div>
  </div>

  <!-- Máscara superior -->
  <div id="hide-location-overlay">🌐 Em qual país você está?</div>

  <!-- Street View Iframe -->
  <iframe id="street-view-container" allowfullscreen></iframe>

  <!-- Minimapa -->
  <div id="guess-container">
    <div id="guess-map"></div>
    <button id="btn-guess" disabled onclick="submitGuess()">Enviar Palpite</button>
  </div>

  <!-- Modal de Resultados / Tabelas -->
  <div id="result-modal">
    <h2 id="winner-title">Resultado da Rodada</h2>
    <div id="result-details"></div>
    <button id="btn-next-round" class="btn-green" style="display:none;" onclick="nextRoundHost()">Próxima Rodada</button>
    <button id="btn-restart-game" class="btn-orange" style="display:none;" onclick="restartGameHost()">🔄 Iniciar Nova Partida (Novos Locais)</button>
    <button id="btn-home-screen" class="btn-gray" style="display:none; margin-top:8px;" onclick="location.reload()">🏠 Voltar à Tela Inicial</button>
    <p id="waiting-host-msg" style="font-size:0.85rem; color:#aaa; display:none;">Aguardando o criador da sala avançar...</p>
  </div>

  <!-- JS do Leaflet e SDKs do Firebase -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBvnd-MlNtB1IGmbT6y90sT-2clIi0Up60",
      authDomain: "testemapa-f65c7.firebaseapp.com",
      databaseURL: "https://testemapa-f65c7-default-rtdb.firebaseio.com",
      projectId: "testemapa-f65c7",
      storageBucket: "testemapa-f65c7.firebasestorage.app",
      messagingSenderId: "941095068365",
      appId: "1:941095068365:web:e9c4bd525df98156b7bf84",
      measurementId: "G-M50RJDGJ17"
    };

    firebase.initializeApp(firebaseConfig);

    // Banco Expandido de Vias e Rodovias 100% Navegáveis do Street View
    const verifiedLocations = [
      // Brasil
      { lat: -22.951916, lng: -43.210487 }, { lat: -29.982145, lng: -52.381230 },
      { lat: -15.793889, lng: -47.882778 }, { lat: -25.428400, lng: -49.273300 },
      { lat: -12.971400, lng: -38.501400 }, { lat: -3.731900, lng: -38.526700 },
      { lat: -30.034600, lng: -51.217700 }, { lat: -19.916700, lng: -43.934500 },
      
      // Américas
      { lat: 37.819928, lng: -122.478255 }, { lat: 36.169900, lng: -115.139800 },
      { lat: 40.758000, lng: -73.985500 },  { lat: 25.761700, lng: -80.191800 },
      { lat: 45.501700, lng: -73.567300 },  { lat: 19.432600, lng: -99.133200 },
      { lat: -33.448900, lng: -70.669300 }, { lat: -34.603700, lng: -58.381600 },
      { lat: -12.046400, lng: -77.042800 }, { lat: 4.711000, lng: -74.072100 },

      // Europa
      { lat: 48.858370, lng: 2.294481 },    { lat: 41.890210, lng: 12.492231 },
      { lat: 51.500729, lng: -0.124625 },   { lat: 52.516275, lng: 13.377704 },
      { lat: 40.416700, lng: -3.703700 },   { lat: 38.722300, lng: -9.139300 },
      { lat: 52.367600, lng: 4.904100 },    { lat: 50.850300, lng: 4.351700 },
      { lat: 48.208200, lng: 16.373800 },   { lat: 47.497900, lng: 19.040200 },
      { lat: 50.075500, lng: 14.437800 },   { lat: 52.229700, lng: 21.012200 },
      { lat: 59.329300, lng: 18.068600 },   { lat: 59.913900, lng: 10.752200 },
      { lat: 60.169900, lng: 24.938400 },   { lat: 55.676100, lng: 12.568300 },
      { lat: 37.983800, lng: 23.727500 },   { lat: 41.008200, lng: 28.978400 },

      // Ásia & Oceania
      { lat: 35.658581, lng: 139.745438 }, { lat: 34.693700, lng: 135.502300 },
      { lat: 37.566500, lng: 126.978000 }, { lat: 1.352100, lng: 103.819800 },
      { lat: 13.756300, lng: 100.501800 }, { lat: 3.139000, lng: 101.686900 },
      { lat: -33.856784, lng: 151.215297 }, { lat: -37.813600, lng: 144.963100 },
      { lat: -36.848500, lng: 174.763300 }, { lat: -41.286500, lng: 174.776200 },

      // África
      { lat: -33.924900, lng: 18.424100 },  { lat: -26.204100, lng: 28.047300 },
      { lat: 31.629500, lng: -7.981100 },   { lat: 30.044400, lng: 31.235700 }
    ];

    let roomRef, playerName, roomId, currentLocation;
    let guessMap, userMarker, realMarker, connectionLine, guessedCoords, timerInterval;
    let isHost = false;
    let currentRound = 1;
    let myGuessSubmitted = false;
    let roundDuration = 120;

    function handleJoin(createNew) {
      playerName = document.getElementById('player-name').value.trim();
      roomId = document.getElementById('room-code').value.trim();
      roundDuration = parseInt(document.getElementById('time-select').value) || 120;

      if (!playerName || !roomId) {
        alert("Preencha seu nome e o código da sala!");
        return;
      }

      document.getElementById('login-card').style.display = 'none';
      document.getElementById('waiting-card').style.display = 'block';
      document.getElementById('display-room-code').innerText = roomId;

      roomRef = firebase.database().ref('rooms/' + roomId);

      if (createNew) {
        isHost = true;
        document.getElementById('btn-start-game').style.display = 'block';
        document.getElementById('waiting-status').innerText = "Sua sala foi criada!";
        document.getElementById('player-list').innerHTML = `<strong>Jogadores Conectados:</strong><br>• ${playerName} 👑 (Dono)`;

        roomRef.set({
          host: playerName,
          status: 'waiting',
          round: 1,
          timeLimit: roundDuration,
          players: { [playerName]: { totalScore: 0 } }
        });

        listenLobby();
      } else {
        roomRef.once('value', snapshot => {
          const data = snapshot.val();
          if (!data) {
            alert("Esta sala não existe ainda! Clique em 'Criar Nova Sala'.");
            location.reload();
            return;
          }
          isHost = (data.host === playerName);
          roundDuration = data.timeLimit || 120;
          roomRef.child('players/' + playerName).update({ totalScore: 0 });
          listenLobby();
        });
      }
    }

    function listenLobby() {
      roomRef.on('value', snapshot => {
        const data = snapshot.val();
        if (!data) return;

        roundDuration = data.timeLimit || 120;
        const players = data.players || {};
        const playerListDiv = document.getElementById('player-list');
        playerListDiv.innerHTML = "<strong>Jogadores Conectados:</strong><br>" + 
          Object.keys(players).map(p => `• ${p} ${p === data.host ? '👑 (Dono)' : ''}`).join('<br>');

        if (isHost && data.status === 'waiting') {
          document.getElementById('btn-start-game').style.display = 'block';
          document.getElementById('host-msg').style.display = 'none';
          document.getElementById('waiting-status').innerText = "Pronto para iniciar!";
        } else if (data.status === 'waiting') {
          document.getElementById('btn-start-game').style.display = 'none';
          document.getElementById('host-msg').style.display = 'block';
          document.getElementById('waiting-status').innerText = "Aguardando o dono iniciar a partida...";
        }

        if (data.status === 'playing') {
          document.getElementById('lobby-overlay').style.display = 'none';
          document.getElementById('hud-info').style.display = 'block';
          
          if (currentRound !== data.round || !currentLocation) {
            currentRound = data.round;
            document.getElementById('current-round').innerText = currentRound;
            loadRoundData(data);
          }

          const playerKeys = Object.keys(players);
          let allSubmitted = playerKeys.length > 0 && playerKeys.every(k => players[k][`r${currentRound}_score`] !== undefined);
          
          if (allSubmitted) {
            showRoundResults(players, data.round);
          }
        }
      });
    }

    function startGameHost() {
      if (!isHost) return;
      const shuffled = [...verifiedLocations].sort(() => 0.5 - Math.random());
      const selectedRounds = shuffled.slice(0, 8);

      roomRef.update({
        status: 'playing',
        round: 1,
        startTime: Date.now(),
        roundsData: selectedRounds
      });
    }

    function loadRoundData(data) {
      myGuessSubmitted = false;
      document.getElementById('result-modal').style.display = 'none';
      document.getElementById('btn-guess').disabled = true;
      document.getElementById('btn-guess').innerText = "Enviar Palpite";

      currentLocation = data.roundsData[currentRound - 1];

      const randomHeading = Math.floor(Math.random() * 360);
      const iframe = document.getElementById('street-view-container');
      iframe.src = `https://maps.google.com/maps?q=&layer=c&cbll=${currentLocation.lat},${currentLocation.lng}&cbp=12,${randomHeading},0,0,0&output=svembed`;

      if (!guessMap) {
        initGuessMap();
      } else {
        clearMapLayers();
      }

      startTimer(data.startTime);
    }

    function clearMapLayers() {
      if (userMarker) { guessMap.removeLayer(userMarker); userMarker = null; }
      if (realMarker) { guessMap.removeLayer(realMarker); realMarker = null; }
      if (connectionLine) { guessMap.removeLayer(connectionLine); connectionLine = null; }
      guessedCoords = null;
    }

    function startTimer(startTime) {
      clearInterval(timerInterval);
      const timerBar = document.getElementById('timer-bar');

      timerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        const timeLeft = Math.max(0, roundDuration - elapsed);
        
        document.getElementById('timer-count').innerText = timeLeft;

        const percentage = (timeLeft / roundDuration) * 100;
        timerBar.style.width = percentage + "%";

        if (percentage < 25) {
          timerBar.style.backgroundColor = "#e74c3c";
        } else if (percentage < 50) {
          timerBar.style.backgroundColor = "#f39c12";
        } else {
          timerBar.style.backgroundColor = "#2ecc71";
        }

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          if (!myGuessSubmitted) submitGuess();
        }
      }, 1000);
    }

    function initGuessMap() {
      guessMap = L.map('guess-map').setView([20, 0], 2);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(guessMap);

      const container = document.getElementById('guess-container');
      container.addEventListener('transitionend', () => guessMap.invalidateSize());

      guessMap.on('click', e => {
        if (myGuessSubmitted) return;
        guessedCoords = e.latlng;
        if (userMarker) userMarker.setLatLng(guessedCoords);
        else userMarker = L.marker(guessedCoords).addTo(guessMap);
        
        document.getElementById('btn-guess').disabled = false;
      });
    }

    function calculateScore(distanceKm) {
      return Math.max(0, Math.round(5000 * Math.exp(-distanceKm / 2000)));
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function submitGuess() {
      if (myGuessSubmitted) return;
      myGuessSubmitted = true;
      document.getElementById('btn-guess').disabled = true;
      document.getElementById('btn-guess').innerText = "Aguardando outros jogadores...";

      const lat = guessedCoords ? guessedCoords.lat : 0;
      const lng = guessedCoords ? guessedCoords.lng : 0;
      
      const dist = guessedCoords ? calculateDistance(currentLocation.lat, currentLocation.lng, lat, lng) : 20000;
      const score = guessedCoords ? calculateScore(dist) : 0;

      roomRef.child('players/' + playerName).once('value', snapshot => {
        const pData = snapshot.val() || {};
        const newTotal = (pData.totalScore || 0) + score;

        const updates = {};
        updates[`r${currentRound}_score`] = score;
        updates[`r${currentRound}_dist`] = Math.round(dist);
        updates[`r${currentRound}_lat`] = lat;
        updates[`r${currentRound}_lng`] = lng;
        updates[`totalScore`] = newTotal;

        roomRef.child('players/' + playerName).update(updates);
      });
    }

    function showRoundResults(players, roundNum) {
      clearInterval(timerInterval);
      const modal = document.getElementById('result-modal');
      const details = document.getElementById('result-details');

      if (!realMarker) {
        realMarker = L.marker([currentLocation.lat, currentLocation.lng]).addTo(guessMap)
          .bindPopup("Local Exato!").openPopup();
      }

      if (guessedCoords) {
        connectionLine = L.polyline([
          [currentLocation.lat, currentLocation.lng],
          [guessedCoords.lat, guessedCoords.lng]
        ], { color: '#e74c3c', weight: 4, dashArray: '6, 8' }).addTo(guessMap);

        const bounds = L.latLngBounds([
          [currentLocation.lat, currentLocation.lng],
          [guessedCoords.lat, guessedCoords.lng]
        ]);
        guessMap.fitBounds(bounds, { padding: [30, 30] });
      }

      if (roundNum >= 8) {
        let html = `
          <table class="result-table">
            <thead>
              <tr><th>Posição</th><th>Jogador</th><th>Pontos Totais</th></tr>
            </thead>
            <tbody>
        `;

        const sortedPlayers = Object.keys(players)
          .map(k => ({ name: k, total: players[k].totalScore || 0 }))
          .sort((a, b) => b.total - a.total);

        sortedPlayers.forEach((p, idx) => {
          const trophy = idx === 0 ? "🥇 " : idx === 1 ? "🥈 " : idx === 2 ? "🥉 " : "";
          html += `<tr><td>${idx + 1}º</td><td>${trophy}${p.name}</td><td><strong>${p.total}</strong> pts</td></tr>`;
        });

        html += `</tbody></table>`;
        document.getElementById('winner-title').innerText = `🏆 Fim de Jogo! Campeão: ${sortedPlayers[0].name}`;
        details.innerHTML = html;

        if (isHost) {
          document.getElementById('btn-restart-game').style.display = 'block';
          document.getElementById('btn-next-round').style.display = 'none';
        }
        document.getElementById('btn-home-screen').style.display = 'block';
        document.getElementById('waiting-host-msg').style.display = 'none';

      } else {
        let html = `
          <p style="color:#aaa; margin-bottom:10px;">Rodada ${roundNum} de 8</p>
          <table class="result-table">
            <thead>
              <tr><th>Jogador</th><th>Distância</th><th>Pontos</th><th>Total</th></tr>
            </thead>
            <tbody>
        `;

        Object.keys(players).forEach(pName => {
          const p = players[pName];
          const rScore = p[`r${roundNum}_score`] || 0;
          const rDist = p[`r${roundNum}_dist`] !== undefined ? p[`r${roundNum}_dist`] + ' km' : 'Sem palpite';

          html += `<tr><td>${pName}</td><td>${rDist}</td><td>+${rScore}</td><td><strong>${p.totalScore || 0}</strong></td></tr>`;
        });

        html += `</tbody></table>`;
        document.getElementById('winner-title').innerText = `Resultado da Rodada ${roundNum}`;
        details.innerHTML = html;

        if (isHost) {
          document.getElementById('btn-next-round').style.display = 'block';
          document.getElementById('btn-restart-game').style.display = 'none';
          document.getElementById('btn-home-screen').style.display = 'none';
          document.getElementById('waiting-host-msg').style.display = 'none';
        } else {
          document.getElementById('btn-next-round').style.display = 'none';
          document.getElementById('btn-restart-game').style.display = 'none';
          document.getElementById('btn-home-screen').style.display = 'none';
          document.getElementById('waiting-host-msg').style.display = 'block';
        }
      }

      modal.style.display = 'block';
    }

    function nextRoundHost() {
      if (!isHost) return;
      roomRef.update({
        round: currentRound + 1,
        startTime: Date.now()
      });
    }

    function restartGameHost() {
      if (!isHost) return;

      const shuffled = [...verifiedLocations].sort(() => 0.5 - Math.random());
      const selectedRounds = shuffled.slice(0, 8);

      roomRef.child('players').once('value', snapshot => {
        const players = snapshot.val() || {};
        const resetPlayers = {};
        
        Object.keys(players).forEach(p => {
          resetPlayers[p] = { totalScore: 0 };
        });

        roomRef.update({
          status: 'playing',
          round: 1,
          startTime: Date.now(),
          roundsData: selectedRounds,
          players: resetPlayers
        });
      });
    }
  </script>
</body>
</html>
